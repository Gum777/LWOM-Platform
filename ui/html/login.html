<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - LWOM 轻量工单管理平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-body">
    <div class="login-card">
      <div class="login-logo">LWO<span class="m">M</span></div>
      <div class="login-title">轻量工单管理平台</div>
      <div class="login-sub">内部运维工单管理系统</div>

      <form action="ticket-list.html">
        <div class="login-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" placeholder="请输入用户名">
        </div>
        <div class="login-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" placeholder="请输入密码">
        </div>
        <div class="login-row">
          <label class="remember"><input type="checkbox" checked> 记住我</label>
          <a href="#">忘记密码?</a>
        </div>
        <button type="submit" class="login-btn">登录</button>
      </form>

      <div class="login-copy">Copyright (C) 2026 LWOM Platform</div>
    </div>
  </div>
</body>
</html>
