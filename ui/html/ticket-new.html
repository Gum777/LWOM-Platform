<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建工单 - LWOM 轻量工单管理平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="logo">LWO<span class="m">M</span></div>
    <ul class="menu">
      <li><a href="ticket-list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>工单列表</a></li>
      <li><a class="active" href="ticket-new.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建工单</a></li>
      <li><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="14"/></svg>数据看板</a></li>
      <li><a href="user-management.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>用户管理</a></li>
      <li><a href="system-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>系统设置</a></li>
    </ul>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <h1>工单列表</h1>
      <div class="topbar-right">
        <span class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><i class="dot"></i></span>
        <span class="user-chip"><span class="avatar"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5z"/></svg></span>管理员</span>
      </div>
    </header>

    <div class="content">
      <div class="page-head"><h2>新建工单</h2></div>

      <form class="card form-card" action="ticket-list.html">
        <div class="form-item">
          <label>工单标题<span class="req">*</span></label>
          <input type="text" placeholder="请输入工单标题">
        </div>

        <div class="form-item">
          <label>工单类型<span class="req">*</span></label>
          <span class="select-wrap" style="display:flex"><select style="width:100%"><option>请选择类型</option><option>报修</option><option>需求咨询</option><option>其他</option></select></span>
        </div>

        <div class="form-item">
          <label>优先级<span class="req">*</span></label>
          <div class="prio-group">
            <span class="prio-btn on">高</span>
            <span class="prio-btn">中</span>
            <span class="prio-btn">低</span>
          </div>
        </div>

        <div class="form-item">
          <label>问题描述<span class="req">*</span></label>
          <textarea placeholder="请详细描述问题现象、影响范围等信息，便于运维人员快速定位处理……"></textarea>
        </div>

        <div class="form-item">
          <label>附件上传</label>
          <div class="upload-zone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="t1">点击或拖拽文件到此处上传</div>
            <div class="t2">支持图片 / 文档，单个文件不超过 5MB</div>
          </div>
        </div>

        <div class="form-footer">
          <span class="tip">带 * 为必填项</span>
          <span class="ops">
            <button type="button" class="btn" onclick="location.href='ticket-list.html'">取 消</button>
            <button type="submit" class="btn btn-primary">提交工单</button>
          </span>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
